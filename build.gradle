plugins {
    id 'fabric-loom' version '1.17.21' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
    id 'maven-publish'
}

if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'buildAll' }) {
    apply from: 'gradle/build-all.gradle'
    return
}

def selected = providers.gradleProperty('mc').getOrElse(project.minecraft_version)
def official = selected.startsWith('26.')
apply plugin: official ? 'net.fabricmc.fabric-loom' : 'fabric-loom'
apply from: 'gradle/minecraft-targets.gradle'
def target = minecraftTarget

group = 'org.qualet'
version = project.irl_core_version + '-' + selected
base { archivesName = 'irl-core' }
repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

sourceSets.main.java.setSrcDirs(["src/main/java", "src/platform/${target.backend}/java",
    "src/platform/${target.native}/java",
    "src/platform/${selected == '1.20.1' || selected == '1.20.4' ? 'mc120' : selected == '1.21.1' ? 'mc121' : selected == '1.21.4' ? 'mc1214' : 'empty'}/java",
    "src/platform/${target.backend == 'modern' ? 'irisModern' : 'iris18'}/java",
    "src/platform/${selected == '26.3' ? 'gl263' : target.backend == 'modern' ? 'glModern' : 'glLegacy'}/java"].unique())

sourceSets.main.java.srcDir 'src/platform/irisShared/java'

if (official) apply from: 'gradle/source-bridge.gradle'

dependencies {
    minecraft "com.mojang:minecraft:${selected}"
    if (!official) mappings "net.fabricmc:yarn:${target.mappings}:v2"
    add(official ? 'implementation' : 'modImplementation', "net.fabricmc:fabric-loader:${target.loader}")
    add(official ? 'compileOnly' : 'modCompileOnly', "maven.modrinth:iris:${target.iris}")
    compileOnly 'org.slf4j:slf4j-api:2.0.9'
}
java {
    sourceCompatibility = JavaVersion.toVersion(target.java)
    targetCompatibility = JavaVersion.toVersion(target.java)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = target.java
}
processResources {
    def properties = [version: project.version, minecraft_version: selected, java_version: target.java]
    inputs.properties properties
    filesMatching('fabric.mod.json') { expand properties }
}
jar { from('LICENSE') { rename { "${it}_irl-core" } } }
publishing {
    publications { mavenJava(MavenPublication) { artifactId = 'irl-core'; from components.java } }
}
def productionJar = tasks.named(official ? 'jar' : 'remapJar')
tasks.register('collectReleaseJar', Copy) {
    dependsOn productionJar
    from productionJar.flatMap { it.archiveFile }
    into file('build/libs')
}
tasks.named('build') { dependsOn 'collectReleaseJar' }

if (providers.gradleProperty('coreSmoke').isPresent()) apply from: 'gradle/smoke.gradle'
